# Prefix: Ctrl+a (ergonomic over Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# True color + italic support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Index from 1 (keyboards start at 1)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# No delay on Escape (important for neovim)
set -sg escape-time 0

# Increase scrollback
set -g history-limit 50000

# Mouse: scroll and click-to-select pane
set -g mouse on

# Vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Intuitive splits (same directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Status bar
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"
set -g status-left-length 20
set -g status-right "#[fg=#6c7086]%H:%M  %d %b "
set -g window-status-current-format "#[fg=#cba6f7,bold] #I:#W "
set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Activity alerts
setw -g monitor-activity on
set -g visual-activity off
